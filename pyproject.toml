[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-confidence"
version = "0.1.0"
description = "Agent decision-confidence meta-layer. One discount on two axes: across sources, whether several vendors are answering the same question; across time, how much of a backtest a model had already read and whether the clean remainder can support an inference at all."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Path B" }]
keywords = [
    "risk",
    "normalization",
    "decision-confidence",
    "agent",
    "mcp",
    "token",
    "crypto",
    "scoring",
    "framework",
    "audit",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
# Core stays dependency-free. The MCP server is opt-in.
mcp = ["mcp>=1.28"]
dev = ["pytest>=7"]

[project.scripts]
decision-confidence-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["normalize", "decision_confidence", "effective_window", "counterfactual", "messages", "mcp_server"]
packages = ["adapters"]
