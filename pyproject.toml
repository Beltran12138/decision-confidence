[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-normalize"
version = "0.1.0"
description = "Agent decision-confidence meta-layer: normalize multi-source risk signals (token instance + multi risk-API mock) onto one 0-100 basis with contradiction detection, confidence, and audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Path B" }]
keywords = [
    "risk",
    "normalization",
    "decision-confidence",
    "agent",
    "mcp",
    "token",
    "crypto",
    "scoring",
    "framework",
    "audit",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
# Core stays dependency-free. The MCP server is opt-in.
mcp = ["mcp>=1.28"]
dev = ["pytest>=7"]

[project.scripts]
risk-normalize-mcp = "mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["normalize", "decision_confidence", "mcp_server"]
packages = ["adapters"]
