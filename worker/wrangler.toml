# Evidence Deflator API: remote MCP + JSON. Build first: python tools/build_worker.py
name = "evidence-deflator-api"
main = "dist/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false  # only the custom domain is public

routes = [
  { pattern = "api.evidencedeflator.com", custom_domain = true }
]

# No request logs are kept (see /privacy/).
[observability]
enabled = false

# OpenAI plugin directory domain check (public token, see src/worker.js).
[vars]
OPENAI_APPS_CHALLENGE = "tVWy7nci9XELrgj1WuNIy15HlyVq6bXstWeT3jhoarM"
