<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence Deflator — AI+X Future Summit 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230B0D10'/%3E%3Crect x='5' y='14' width='22' height='4' rx='1' fill='%23C9A24C'/%3E%3Crect x='5' y='21' width='9' height='4' rx='1' fill='%235E8C6A'/%3E%3C/svg%3E">
<style>
:root{--bg:#0B0D10;--panel:#101319;--ink:#E9E5DC;--dim:#767C85;--dim2:#565C64;
      --rule:#22262C;--rule2:#191D23;--gold:#C9A24C;--red:#C4453C;--grn:#5E8C6A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Microsoft YaHei','PingFang SC',sans-serif;
     -webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:Consolas,'JetBrains Mono',monospace}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:26px;
       padding:0 42px;height:58px;border-bottom:1px solid var(--rule);background:rgba(11,13,16,.92);z-index:5}
.brand{font-family:Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.06em}
.brand em{color:var(--gold);font-style:normal}
nav{display:flex;gap:6px;margin-left:auto}
nav button{font-family:Consolas,monospace;font-size:12px;letter-spacing:.1em;color:var(--dim);
     background:transparent;border:1px solid transparent;padding:7px 11px;cursor:pointer;border-radius:2px}
nav button.on{color:var(--ink);border-color:var(--rule)}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:18px;
       padding:0 42px;height:46px;border-top:1px solid var(--rule2);color:var(--dim2);
       font-size:12px;font-family:Consolas,monospace;letter-spacing:.05em;background:rgba(11,13,16,.92)}
footer .keys{margin-left:auto;letter-spacing:.12em}
main{height:100%;padding:58px 0 46px;display:flex}
.slide{display:none;flex:1;padding:0 max(42px,6vw);align-items:center;justify-content:center}
.slide.on{display:flex;animation:rise .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cover{flex-direction:column;text-align:center;gap:4vh}
.kick{font-family:Consolas,monospace;font-size:13px;letter-spacing:.3em;color:var(--gold)}
.cover h1{font-family:'Noto Serif SC',serif;font-size:clamp(30px,4.2vw,52px);font-weight:600;line-height:1.3}
.nums{display:flex;gap:5vw;justify-content:center;align-items:baseline}
.nums div{text-align:center}
.nums b{display:block;font-family:Consolas,monospace;font-weight:700;font-size:clamp(46px,7.5vw,104px);line-height:1}
.nums span{display:block;margin-top:12px;font-size:14px;color:var(--dim);letter-spacing:.06em}
.c-ink{color:var(--ink)}.c-dim{color:var(--dim)}
.caveat{font-size:13px;color:var(--grn);margin-top:6px}
[hidden]{display:none!important}.c-red{color:var(--red)}.c-gold{color:var(--gold)}.c-grn{color:var(--grn)}
.sub{font-family:'Noto Serif SC',serif;font-size:clamp(17px,1.7vw,24px);color:var(--dim)}
.sub b{color:var(--ink);font-weight:600}
.scene{gap:max(46px,5vw)}
.left{max-width:480px}
.tagline{font-family:Consolas,monospace;font-size:12.5px;letter-spacing:.26em;color:var(--gold);margin-bottom:22px}
.story{font-family:'Noto Serif SC',serif;font-size:clamp(23px,2.35vw,34px);font-weight:600;line-height:1.62}
.story em{font-style:normal;color:var(--gold)}
.story .r{color:var(--red)}.story .g{color:var(--grn)}
.moral{margin-top:26px;font-size:15.5px;line-height:1.8;color:var(--dim);border-left:2px solid var(--rule);padding-left:16px}
.card{width:min(520px,44vw);background:var(--panel);border:1px solid var(--rule);border-top:2px solid rgba(201,162,76,.55);
      padding:34px 38px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 14px 34px rgba(0,0,0,.38)}
.cap{font-family:Consolas,monospace;font-size:11.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:18px}
.big{font-family:Consolas,monospace;font-weight:700;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:27px;color:var(--dim);font-weight:400}
.badge{display:inline-block;font-family:Consolas,monospace;font-size:13px;font-weight:700;letter-spacing:.14em;
       padding:6px 15px;border-radius:2px;margin:18px 0 4px;transition:all .4s}
.badge.warn{color:var(--gold);border:1px solid var(--gold);background:rgba(201,162,76,.09)}
.badge.ok{color:var(--grn);border:1px solid var(--grn);background:rgba(94,140,106,.12)}
.bar{height:11px;background:#20252C;border-radius:2px;overflow:hidden;margin:20px 0 8px}
.bar i{display:block;height:100%;background:var(--red);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-note{font-size:12.5px;color:var(--dim2)}
.rows{margin-top:20px;border-top:1px solid var(--rule2)}
.rows div{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule2)}
.rows dt{font-size:14px;color:var(--dim)}
.rows dd{font-family:Consolas,monospace;font-size:16px;font-variant-numeric:tabular-nums}
.rows .key dd{font-size:22px;color:var(--gold);font-weight:700}
.toggle{margin-top:20px;display:flex;gap:8px;align-items:center;font-family:Consolas,monospace;font-size:12px;color:var(--dim)}
.toggle button{font-family:Consolas,monospace;font-size:12px;letter-spacing:.08em;padding:7px 12px;cursor:pointer;
       background:transparent;color:var(--dim);border:1px solid var(--rule);border-radius:2px}
.toggle button.on{color:var(--ink);border-color:var(--gold)}
/* two vendors */
.vs{display:flex;gap:3vw;align-items:stretch}
.vs>div{width:min(300px,24vw);background:var(--panel);border:1px solid var(--rule);padding:30px 28px}
.vs b{display:block;font-family:Consolas,monospace;font-size:88px;line-height:1;font-weight:700}
.vs h4{font-size:13px;color:var(--dim);letter-spacing:.14em;font-family:Consolas,monospace;margin-bottom:16px}
.vs p{margin-top:18px;font-size:16px;line-height:1.7}
.avg{align-self:center;text-align:center;font-family:Consolas,monospace;color:var(--dim2)}
.avg s{display:block;font-size:44px;color:var(--dim2)}
/* grid of three */
.three{display:flex;gap:2.4vw;justify-content:center}
.three>div{width:min(310px,26vw);background:var(--panel);border:1px solid var(--rule);border-top:2px solid var(--gold);padding:28px 26px;text-align:left}
.three i{font-family:Consolas,monospace;font-style:normal;font-size:13px;color:var(--gold);letter-spacing:.2em}
.three h3{font-family:'Noto Serif SC',serif;font-size:21px;margin:10px 0 12px}
.three p{font-size:15px;line-height:1.7;color:var(--dim)}
.model{display:flex;gap:2vw;justify-content:center;margin-top:3vh}
.model>div{border:1px solid var(--rule);padding:16px 22px;font-size:15px;line-height:1.6;min-width:260px;text-align:left}
.model b{color:var(--gold);font-family:Consolas,monospace;letter-spacing:.1em;font-size:12px;display:block;margin-bottom:6px}
.honest{margin-top:2.5vh;font-size:14px;color:var(--dim2)}
/* ask */
.ask{display:flex;gap:5vw;align-items:center}
.facts{list-style:none;font-size:18px;line-height:2.1;text-align:left}
.facts li::before{content:'—  ';color:var(--gold)}
.qr{width:200px;height:200px;border:1px dashed var(--dim2);display:flex;align-items:center;justify-content:center;
    color:var(--dim2);font-family:Consolas,monospace;font-size:12px;text-align:center;padding:12px}
[data-l="en"] .zh,[data-l="zh"] .en{display:none}
</style>
</head>
<body data-l="zh">
<header>
  <div class="brand">Evidence Deflator <em>· <span class="zh">投研证据折扣器</span><span class="en">what is this evidence worth?</span></em></div>
  <nav id="nav"></nav>
</header>
<main id="stage"></main>
<footer>
  <span><span class="zh">每个数字都可在开源引擎里复算</span><span class="en">Every number here can be recomputed with the open-source engine</span> · pip install decision-confidence</span>
  <span class="keys">← → · T <span class="zh">切换模型</span><span class="en">switch model</span> · L 中/EN</span>
</footer>

<script>
// 数字均为 tools/window.py 现跑结果（2026-10-05）：区间 2020-01→2025-06，目标夏普 1，t=2
const SC={
  late:{cut:'2024-10',clean:8,open:58,share:87.9,need:48,ok:false},
  early:{cut:'2021-06',clean:48,open:18,share:27.3,need:48,ok:true},
  early20:{cut:'2021-06',clean:48,open:18,share:27.3,need:112,ok:false}
};
function card(id,s,toggle){
  return '<div class="card" id="'+id+'"><div class="cap"><span class="zh">干净区间 · 可用于检验</span><span class="en">CLEAN MONTHS · USABLE FOR TESTING</span></div>'+
  '<div class="big"><span class="v-clean">'+s.clean+'</span><small> / 66 <span class="zh">个月</span><span class="en">months</span></small></div>'+
  '<div><span class="badge '+(s.ok?'ok':'warn')+'">'+(s.ok?'SUFFICIENT':'UNDERPOWERED')+'</span></div>'+
  '<div class="caveat"'+(s.ok?'':' hidden')+'><span class="zh">只解除「长度」这一条限制，不构成策略有效的证据</span><span class="en">clears length only — not evidence the strategy works</span></div>'+
  '<div class="bar"><i style="width:0%" data-w="'+s.share+'"></i></div>'+
  '<div class="bar-note"><span class="zh">红色 = 无法排除模型训练时已读过的月份</span><span class="en">red = months the model may already have read</span></div>'+
  '<div class="rows">'+
   '<div class="key"><dt><span class="zh">所需长度</span><span class="en">required</span></dt><dd><span class="v-need">'+s.need+'</span></dd></div>'+
   '<div><dt><span class="zh">实有干净区间</span><span class="en">clean available</span></dt><dd class="v-clean2">'+s.clean+'</dd></div>'+
   '<div><dt><span class="zh">模型训练截止</span><span class="en">model knowledge cutoff</span></dt><dd class="v-cut">'+s.cut+'</dd></div>'+
  '</div>'+
  (toggle?'<div class="toggle"><span class="zh">模型截止</span><span class="en">cutoff</span><button data-k="late" class="on">2024-10</button><button data-k="early">2021-06</button></div>':'')+
  '</div>';
}
const S=[
 {nav:'00',html:
  '<div class="slide cover"><div class="kick">EVIDENCE DEFLATOR · AI+X FUTURE SUMMIT 2026</div>'+
  '<h1><span class="zh">AI 让每个数都有了出处<br>出处之后的那一步：这份证据值多少？</span><span class="en">AI can now cite every number.<br>The next question: what is that evidence worth?</span></h1>'+
  '<div class="nums"><div><b class="c-ink">66</b><span class="zh">回测月数</span><span class="en">months backtested</span></div>'+
  '<div><b class="c-red">8</b><span class="zh">闭卷的</span><span class="en">closed-book</span></div>'+
  '<div><b class="c-gold">48</b><span class="zh">下结论需要的</span><span class="en">needed to conclude</span></div>'+
  '<div><b class="c-gold">112</b><span class="zh">试过 20 组之后</span><span class="en">after 20 tries</span></div></div>'+
  '<div class="sub"><span class="zh">伯纳德 · 《AI 智能投资手册》第十一章作者</span><span class="en">Bernard · author, Chapter 11</span></div></div>'},
 {nav:'01',html:
  '<div class="slide scene"><div class="left"><div class="tagline"><span class="zh">一 · 开卷考试</span><span class="en">01 · OPEN-BOOK EXAM</span></div>'+
  '<div class="story"><span class="zh">回测 66 个月，曲线很漂亮。<br>其中 58 个月，<em>无法排除模型读过</em>。</span><span class="en">66 months, a beautiful curve.<br><em>58 of them the model may already have read.</em></span></div>'+
  '<div class="moral"><span class="zh">闭卷的只有 8 个月。夏普为 1 的策略，要站住约需 48 个月干净数据。</span><span class="en">Only 8 are closed-book. A Sharpe-1 claim needs about 48.</span></div></div>'+
  card('c1',SC.late,false)+'</div>'},
 {nav:'02',html:
  '<div class="slide scene"><div class="left"><div class="tagline"><span class="zh">二 · 换一个模型</span><span class="en">02 · AN EARLIER MODEL</span></div>'+
  '<div class="story"><span class="zh">换一个训练截止更早的模型，<br>闭卷变成 48 个月，<em>刚好够长</em>。</span><span class="en">An earlier cutoff:<br>48 closed-book months, <em>just long enough</em>.</span></div>'+
  '<div class="moral"><span class="zh">这只说明样本有资格被检验，不说明策略好。按 T 切换。</span><span class="en">Long enough to be tested — not proof it works. Press T.</span></div></div>'+
  card('c3',SC.late,true)+'</div>'},
 {nav:'03',html:
  '<div class="slide scene"><div class="left"><div class="tagline"><span class="zh">三 · 试了 20 次</span><span class="en">03 · TWENTY TRIES</span></div>'+
  '<div class="story"><span class="zh">他试过 20 组参数，只给你看最好的。<br><em>20 个荐股群，总有一个看起来最准</em>。</span><span class="en">Twenty parameter sets tried, the best one shown.<br><em>One of twenty tip groups always looks best.</em></span></div>'+
  '<div class="moral"><span class="zh">算进挑选，门槛升到 112。哪怕 66 个月全部闭卷，也不够。</span><span class="en">Count the selection: the bar is 112. Even all 66 closed-book would fall short.</span></div></div>'+
  card('c2',SC.early20,false)+'</div>'},
 {nav:'04',html:
  '<div class="slide cover"><div class="kick"><span class="zh">公开审计 · 17 篇 LLM 交易论文 · 截止日只认模型方官方文档</span><span class="en">PUBLIC AUDIT · 17 LLM TRADING PAPERS · CUTOFFS FROM PROVIDER DOCS ONLY</span></div>'+
  '<div class="nums"><div><b class="c-ink">9</b><span class="zh">查得到截止日</span><span class="en">with a documented cutoff</span></div>'+
  '<div><b class="c-red">0</b><span class="zh">干净样本 ≥ 48 个月</span><span class="en">reach 48 clean months</span></div>'+
  '<div><b class="c-gold">4</b><span class="zh">测试期大半在截止日前</span><span class="en">tested mostly before cutoff</span></div>'+
  '<div><b class="c-dim">8</b><span class="zh">无从判断</span><span class="en">cannot be assessed</span></div></div>'+
  '<div class="sub"><span class="zh">多数无从判断，是因为模型<b>根本没有公布</b>训练截止日。新论文已多在截止日之后测试：<b>问题正从「开卷」变成「太短」</b>。</span><span class="en">Most of those cannot be assessed because the model <b>never published</b> a cutoff. Newer papers test after the cutoff: <b>the problem is moving from open-book to too short</b>.</span></div></div>'},
 {nav:'05',html:
  '<div class="slide cover"><div class="kick"><span class="zh">第二条轴 · 出处都对，问题不同</span><span class="en">SECOND AXIS · SOURCES RIGHT, QUESTIONS DIFFERENT</span></div>'+
  '<div class="vs"><div><h4><span class="zh">风险数据商 A</span><span class="en">VENDOR A</span></h4><b class="c-red">69</b><p><span class="zh">量的是：发行方对合约有多大控制权</span><span class="en">measures: how much control the issuer holds</span></p></div>'+
  '<div class="avg"><s>35</s><span class="zh">平均数没有意义</span><span class="en">the average means nothing</span></div>'+
  '<div><h4><span class="zh">风险数据商 B</span><span class="en">VENDOR B</span></h4><b class="c-grn">1</b><p><span class="zh">量的是：这个代币现在能不能交易</span><span class="en">measures: whether it can trade right now</span></p></div></div>'+
  '<div class="sub"><span class="zh">同一个代币，两家都没算错，<b>出处都清清楚楚，问的却是两个问题</b>。</span><span class="en">Same token, both correct, <b>both cited — answering different questions</b>.</span></div></div>'},
 {nav:'06',html:
  '<div class="slide cover"><div class="kick"><span class="zh">不需要你的策略 · 只要三样东西</span><span class="en">NO STRATEGY NEEDED · JUST THREE THINGS</span></div>'+
  '<div class="ask"><ul class="facts">'+
   '<li><span class="zh">模型训练截止日</span><span class="en">the model\'s knowledge cutoff</span></li>'+
   '<li><span class="zh">回测起止月份</span><span class="en">backtest start and end month</span></li>'+
   '<li><span class="zh">试了几组参数</span><span class="en">how many variants were tried</span></li>'+
  '</ul><div class="qr">QR<br><span class="zh">公开审计表</span><span class="en">public audit</span><br>（v2 占位）</div></div>'+
  '<h1 style="font-size:clamp(24px,3vw,40px)"><span class="zh">发给我，我当场告诉你有多少证据作数；<br>也欢迎把你见过的回测加进公开审计表</span><span class="en">Send them and I\'ll tell you how much evidence counts —<br>and help grow the public audit</span></h1>'+
  '<div class="sub">pip install decision-confidence · <span class="zh">方法见本书第十一章</span><span class="en">method in Chapter 11</span></div></div>'}
];
const stage=document.getElementById('stage'),nav=document.getElementById('nav');
S.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.nav;b.onclick=()=>go(i);nav.appendChild(b);
  const t=document.createElement('div');t.innerHTML=s.html;stage.appendChild(t.firstChild);});
function animBar(el){const bar=el.querySelector('.bar i');if(bar){bar.style.width='0%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=bar.dataset.w+'%';}));}}
function setScene(c,k){const s=SC[k];
  c.querySelector('.v-clean').textContent=s.clean;c.querySelector('.v-clean2').textContent=s.clean;
  c.querySelector('.v-need').textContent=s.need;c.querySelector('.v-cut').textContent=s.cut;
  const bd=c.querySelector('.badge');bd.className='badge '+(s.ok?'ok':'warn');bd.textContent=s.ok?'SUFFICIENT':'UNDERPOWERED';c.querySelector('.caveat').hidden=!s.ok;
  const bar=c.querySelector('.bar i');bar.dataset.w=s.share;bar.style.width=s.share+'%';
  c.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>setScene(b.closest('.card'),b.dataset.k));
let cur=-1;
function go(i){if(i<0||i>=S.length||i===cur)return;cur=i;
  [...stage.children].forEach((el,k)=>{el.classList.toggle('on',k===i);if(k===i){
    const c=el.querySelector('#c3');if(c)setScene(c,'late');animBar(el);}});
  [...nav.children].forEach((el,k)=>el.classList.toggle('on',k===i));}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(/^[0-6]$/.test(e.key))go(+e.key);
  else if(e.key==='t'||e.key==='T'){const c=document.querySelector('.slide.on #c3');
    if(c){const on=c.querySelector('.toggle button.on').dataset.k;setScene(c,on==='late'?'early':'late');}}
  else if(e.key==='l'||e.key==='L'){document.body.dataset.l=document.body.dataset.l==='zh'?'en':'zh';}
});
go(0);
</script>
</body>
</html>
